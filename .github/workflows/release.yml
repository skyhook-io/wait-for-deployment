name: Release
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cycjimmy/semantic-release-action@1989a0fefc4aea321e07f717680ed8e345925dc1 # v7.1.2
        with:
          extra_plugins: |
            semantic-release-github-actions-tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}